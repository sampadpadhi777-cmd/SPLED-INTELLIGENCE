name: SPLED INTELLIGENCE - Android CI and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-development
    paths:
      - 'android/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: read

concurrency:
  group: spled-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Android project
        working-directory: android
        run: |
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml

      - name: Run unit tests and assemble debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug 2>&1 | tee /tmp/spled-gradle-build.log

      - name: Verify APK and checksum
        if: success()
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p /tmp/spled-artifacts
          cp "$APK" /tmp/spled-artifacts/SPLED-INTELLIGENCE-debug.apk
          sha256sum /tmp/spled-artifacts/SPLED-INTELLIGENCE-debug.apk > /tmp/spled-artifacts/SHA256SUMS.txt
          ls -lh /tmp/spled-artifacts/

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/spled-artifacts/diagnostics
          if [ -f /tmp/spled-gradle-build.log ]; then cp /tmp/spled-gradle-build.log /tmp/spled-artifacts/diagnostics/; fi
          if [ -d android/app/build/reports ]; then cp -r android/app/build/reports /tmp/spled-artifacts/diagnostics/; fi
          if [ -d android/app/build/test-results ]; then cp -r android/app/build/test-results /tmp/spled-artifacts/diagnostics/; fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPLED-INTELLIGENCE-DEBUG-APK
          path: /tmp/spled-artifacts/SPLED-INTELLIGENCE-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPLED-INTELLIGENCE-BUILD-DIAGNOSTICS
          path: /tmp/spled-artifacts/diagnostics/
          if-no-files-found: warn
          retention-days: 14
