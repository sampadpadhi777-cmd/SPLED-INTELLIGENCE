name: SPLED INTELLIGENCE - Extract, Test and Build APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SPLED_INTELLIGENCE*.zip'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

concurrency:
  group: spled-intelligence-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Extract source, validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and verify source ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find . -maxdepth 1 -type f -iname 'SPLED_INTELLIGENCE*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one SPLED_INTELLIGENCE*.zip in repository root; found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          test -s "$archive"
          unzip -t "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Extract and verify project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spled-source"
          unzip -q "${{ steps.archive.outputs.archive }}" -d "$RUNNER_TEMP/spled-source"
          PROJECT="$RUNNER_TEMP/spled-source/SPLED_INTELLIGENCE"
          for file in \
            README.md \
            BUILD_STATUS.md \
            android/settings.gradle.kts \
            android/build.gradle.kts \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml \
            backend/requirements.txt \
            backend/research/requirements.txt \
            backend/research/train_walkforward.py; do
            test -s "$PROJECT/$file" || { echo "Missing required file: $PROJECT/$file"; exit 1; }
          done
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project structure verified."

      - name: Copy source into repository (preserve active workflow)
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT_DIR/" ./
          test -s README.md
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s backend/research/train_walkforward.py

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Extract SPLED INTELLIGENCE v0.8.0 source'
            git push origin HEAD:main
          else
            echo 'Source files already up to date.'
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/research/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r backend/requirements.txt -r backend/research/requirements.txt

      - name: Compile Python and run tests
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app/*.py backend/research/*.py
          python -m pytest -q backend/tests backend/research/tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'
          sdkmanager --list_installed

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android unit tests and build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPLED-INTELLIGENCE-v0.8.0-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPLED-INTELLIGENCE-build-diagnostics
          path: |
            ${{ runner.temp }}/gradle-build.log
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
